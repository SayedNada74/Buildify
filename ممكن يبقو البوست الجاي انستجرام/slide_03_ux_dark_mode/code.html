<!DOCTYPE html><html dir="rtl" lang="ar"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>UX Definition</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#cbdbf5",
                        "inverse-surface": "#213145",
                        "tertiary-container": "#271901",
                        "tertiary-fixed-dim": "#dec29a",
                        "on-surface-variant": "#45464d",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-container-low": "#eff4ff",
                        "on-background": "#0b1c30",
                        "secondary": "#006b5f",
                        "on-tertiary-container": "#98805d",
                        "secondary-container": "#62fae3",
                        "outline": "#76777d",
                        "on-error": "#ffffff",
                        "surface": "#f8f9ff",
                        "secondary-fixed-dim": "#3cddc7",
                        "surface-variant": "#d3e4fe",
                        "on-tertiary-fixed-variant": "#574425",
                        "surface-container-highest": "#d3e4fe",
                        "outline-variant": "#c6c6cd",
                        "surface-container": "#e5eeff",
                        "primary-fixed-dim": "#bec6e0",
                        "surface-container-high": "#dce9ff",
                        "tertiary-fixed": "#fcdeb5",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "background": "#0f172a",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-tint": "#565e74",
                        "on-secondary-fixed": "#00201c",
                        "error-container": "#ffdad6",
                        "tertiary": "#000000",
                        "primary": "#000000",
                        "secondary-fixed": "#62fae3",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#271901",
                        "inverse-primary": "#bec6e0",
                        "primary-fixed": "#dae2fd",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#7c839b",
                        "on-primary-fixed": "#131b2e",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#007165",
                        "primary-container": "#0f172a",
                        "on-secondary-fixed-variant": "#005047",
                        "on-surface": "#0b1c30",
                        "surface-bright": "#f8f9ff",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1.5rem"
                    },
                    "spacing": {
                        "container-max-width": "1280px",
                        "column-count": "12",
                        "gutter": "24px",
                        "margin-desktop": "72px",
                        "unit-base": "8px"
                    },
                    "fontFamily": {
                        "headline-md": ["IBM Plex Sans Arabic"],
                        "headline-lg": ["IBM Plex Sans Arabic"],
                        "headline-xl": ["IBM Plex Sans Arabic"],
                        "headline-lg-mobile": ["IBM Plex Sans Arabic"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-xl": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-sm": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-on-primary-container font-body-md min-h-screen flex flex-col items-center justify-center p-8">
<!-- TopNavBar Omitted as per instructions for presentation slides -->
<main class="w-full max-w-[800px] aspect-square bg-gradient-to-br from-[#1a233a] to-[#0f172a] rounded-[2rem] shadow-2xl relative overflow-hidden flex flex-col border border-white/5">
<!-- Background subtle glow -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-secondary-fixed/10 via-transparent to-transparent pointer-events-none"></div>
<!-- Header -->
<header class="flex justify-between items-center p-8 z-10">
<div class="flex items-center gap-4">
<span class="bg-surface-variant/10 text-white px-4 py-2 rounded-full font-label-sm border border-white/10 backdrop-blur-sm">
                    @BUILDIFYO
                </span>
<span class="bg-secondary-fixed/20 text-secondary-container px-4 py-2 rounded-full font-label-sm border border-secondary-fixed/30 flex items-center gap-2 backdrop-blur-sm">
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
                    3/8
                </span>
</div>
<div class="flex items-center gap-3">
<span class="font-headline-lg text-white font-bold tracking-tight">Buildify</span>
<div class="w-10 h-10 bg-secondary-fixed/20 rounded-lg flex items-center justify-center border border-secondary-fixed/30 relative overflow-hidden">
<span class="material-symbols-outlined text-secondary-container relative z-10">layers</span>
</div>
</div>
</header>
<!-- Content Area -->
<div class="flex-grow flex flex-col items-center justify-center px-12 z-10">
<!-- Badge -->
<div class="mb-12">
<span class="bg-secondary-fixed/20 text-secondary-container px-6 py-2 rounded-full font-label-sm border border-secondary-fixed/30 flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary-fixed animate-pulse"></span>
                    UX = How it feels. 🧠
                </span>
</div>
<!-- Title & Main Text -->
<div class="text-center mb-12">
<p class="font-headline-lg text-white mb-6 leading-tight max-w-[600px] mx-auto text-center">
                    لكن لو... مش عارف تطلب، الأسعار مش واضحة، الطلب بياخد وقت، مش عارف تدفع إزاي... هنا المشكلة في UX.
                 </p>
</div>
<!-- Journey Diagram Card -->
<div class="bg-surface-variant/5 border border-white/10 rounded-2xl p-8 w-full backdrop-blur-md relative">
<div class="flex justify-between items-center relative z-10">
<!-- Step 1 -->
<div class="flex flex-col items-center gap-3 relative z-10">
<div class="w-12 h-12 rounded-full bg-surface-variant/20 flex items-center justify-center border border-white/10 text-white">
<span class="material-symbols-outlined">search</span>
</div>
<span class="font-label-sm text-surface-dim">Choose</span>
</div>
<!-- Line -->
<div class="flex-grow h-px bg-white/10 mx-4 relative top-[-14px]"></div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-3 relative z-10">
<div class="w-12 h-12 rounded-full bg-surface-variant/20 flex items-center justify-center border border-white/10 text-white">
<span class="material-symbols-outlined">tune</span>
</div>
<span class="font-label-sm text-surface-dim">Customize</span>
</div>
<!-- Line -->
<div class="flex-grow h-px bg-white/10 mx-4 relative top-[-14px]"></div>
<!-- Step 3 (Warning) -->
<div class="flex flex-col items-center gap-3 relative z-10 group">
<!-- Warning Tooltip -->
<div class="absolute -top-12 whitespace-nowrap bg-error text-on-error font-label-sm px-3 py-1 rounded-md opacity-100 flex items-center gap-1 shadow-lg border border-error/50">
<span class="material-symbols-outlined text-[14px]">warning</span>
                            CONFUSING
                            <!-- Arrow -->
<div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-error rotate-45 border-r border-b border-error/50"></div>
</div>
<div class="w-12 h-12 rounded-full bg-error/20 flex items-center justify-center border border-error text-error">
<span class="material-symbols-outlined">shopping_cart</span>
</div>
<span class="font-label-sm text-error font-bold">Order</span>
</div>
<!-- Line -->
<div class="flex-grow h-px bg-white/10 mx-4 relative top-[-14px]"></div>
<!-- Step 4 -->
<div class="flex flex-col items-center gap-3 relative z-10">
<div class="w-12 h-12 rounded-full bg-surface-variant/20 flex items-center justify-center border border-white/10 text-white">
<span class="material-symbols-outlined">payments</span>
</div>
<span class="font-label-sm text-surface-dim">Pay</span>
</div>
</div>
</div>
</div>
<!-- Footer -->
<footer class="flex justify-between items-center p-8 mt-auto z-10 text-surface-dim font-label-sm">
<span class="text-secondary-fixed">حلول رقمية</span>
<span class="opacity-60">03 / 08</span>
<span>@buildify0</span>
</footer>
</main>
</body></html>
